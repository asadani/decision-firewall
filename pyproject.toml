[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-firewall"
version = "0.3.0"
description = "Extensible decision governance: evidence, policy, authorization, execution and receipts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "cryptography>=44", "rfc8785>=0.1,<1"]

[project.optional-dependencies]
telemetry = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]
inspector = ["fastapi>=0.115,<1", "jinja2>=3.1,<4", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "itsdangerous>=2.2,<3"]
evaluation = ["psutil>=6"]
laya = ["laya==0.3.20"]

[project.scripts]
firewall = "decision_firewall.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_firewall = ["templates/*.html", "static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/decision_firewall"]

