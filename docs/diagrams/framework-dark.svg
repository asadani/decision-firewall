<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" class="architecture" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Decision Firewall architecture</title>
<desc id="diagram-description">A proposal and optional assessment enter a shared governance runtime. Trusted domain evidence and policy govern authorization. Revalidation and resource reservation precede idempotent execution. Unknown outcomes reconcile without blind retries. Linked audit records support receipts and investigation. Models cannot grant authority.</desc>
<style>.architecture{--bg:#0b1422;--panel:#142236;--ink:#eef4fc;--muted:#aec0d5;--line:#8097b1;--border:#3b526e;--blue:#8db9ff;--amber:#ffd08a;--teal:#7cdbca;--gate:#302719}
text{font-family:'Segoe UI',Arial,sans-serif;fill:var(--ink);font-size:18px} .heading{font-family:Bahnschrift,'Segoe UI',sans-serif;font-size:42px;font-weight:600}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:var(--muted)}.sub{fill:var(--muted);font-size:17px}.title{font-size:22px;font-weight:600}.step-title{font-size:18px;font-weight:600}.number{font:600 16px Consolas,monospace;fill:var(--blue)}.panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.wire{stroke:var(--line);stroke-width:2;fill:none}.dependency{stroke-dasharray:5 5}.gate{fill:var(--gate);stroke:var(--amber);stroke-width:2}.amber{fill:var(--amber)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.stage.active rect{stroke:var(--blue);stroke-width:4}.stage.active .number{fill:var(--ink)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="900" rx="16" fill="var(--bg)"/>
<text x="52" y="48" class="eyebrow">ARCHITECTURE / REFERENCE IMPLEMENTATION</text>
<text x="52" y="105" class="heading">Decision Firewall</text>
<text x="52" y="140" class="sub">From a proposed action to an accountable outcome.</text>
<text x="1348" y="105" class="eyebrow" text-anchor="end">MODEL OPTIONAL</text>
<rect x="52" y="186" width="412" height="146" rx="10" class="panel"/><text x="74" y="217" class="eyebrow">01 / PROPOSAL</text><text x="74" y="251" class="title">Your application</text><text x="74" y="282" class="sub">Independent intent + typed action</text><text x="74" y="307" class="sub">Human, program or model originated</text><rect x="494" y="186" width="412" height="146" rx="10" class="panel"/><text x="516" y="217" class="eyebrow">02 / ASSESSMENT</text><text x="516" y="251" class="title">Decision model</text><text x="516" y="282" class="sub">Typed signals and recommendations</text><text x="516" y="307" class="sub">Cannot grant execution authority</text><rect x="936" y="186" width="412" height="146" rx="10" class="panel"/><text x="958" y="217" class="eyebrow">03 / TRUSTED FACTS</text><text x="958" y="251" class="title">Evidence resolver</text><text x="958" y="282" class="sub">Authoritative records + versions</text><text x="958" y="307" class="sub">Model claims are not evidence</text>
<path d="M 147 332 V 442" class="wire " marker-end="url(#arrow)"/>
<path d="M 700 332 V 353 H 200 V 442" class="wire " marker-end="url(#arrow)"/>
<path d="M 1142 332 V 372 H 371 V 442" class="wire " marker-end="url(#arrow)"/>
<rect x="52" y="398" width="1296" height="208" rx="12" fill="none" stroke="var(--border)"/>
<text x="960" y="425" class="eyebrow">SHARED GOVERNANCE RUNTIME</text>
<g class="stage" data-step="0"><rect x="72" y="448" width="184" height="108" rx="8" class="panel"/><text x="86" y="474" class="number">01</text><text x="86" y="507" class="step-title">Validate &amp; persist</text><text x="86" y="536" class="sub" style="font-size:14px">Intent + typed action</text></g><path d="M 257 503 H 283" class="wire flow flow-1" marker-end="url(#arrow)"/><g class="stage" data-step="1"><rect x="286" y="448" width="184" height="108" rx="8" class="panel"/><text x="300" y="474" class="number">02</text><text x="300" y="507" class="step-title">Policy &amp; review</text><text x="300" y="536" class="sub" style="font-size:14px">Facts + versioned rules</text></g><path d="M 471 503 H 497" class="wire flow flow-2" marker-end="url(#arrow)"/><g class="stage" data-step="2"><rect x="500" y="448" width="184" height="108" rx="8" class="gate"/><text x="514" y="474" class="number amber">03</text><text x="514" y="507" class="step-title">Bind authorization</text><text x="514" y="536" class="sub" style="font-size:14px">Exact action + expiry</text></g><path d="M 685 503 H 711" class="wire flow flow-3" marker-end="url(#arrow)"/><g class="stage" data-step="3"><rect x="714" y="448" width="184" height="108" rx="8" class="panel"/><text x="728" y="474" class="number">04</text><text x="728" y="507" class="step-title">Check &amp; reserve</text><text x="728" y="536" class="sub" style="font-size:14px">Atomic resource claims</text></g><path d="M 899 503 H 925" class="wire flow flow-4" marker-end="url(#arrow)"/><g class="stage" data-step="4"><rect x="928" y="448" width="184" height="108" rx="8" class="panel"/><text x="942" y="474" class="number">05</text><text x="942" y="507" class="step-title">Dispatch</text><text x="942" y="536" class="sub" style="font-size:14px">Durable idempotency key</text></g><path d="M 1113 503 H 1139" class="wire flow flow-5" marker-end="url(#arrow)"/><g class="stage" data-step="5"><rect x="1142" y="448" width="184" height="108" rx="8" class="panel"/><text x="1156" y="474" class="number">06</text><text x="1156" y="507" class="step-title">Resolve outcome</text><text x="1156" y="536" class="sub" style="font-size:14px">Reconcile when unknown</text></g>
<text x="405" y="584" class="sub">Execution continues only when all prerequisites pass.</text>
<path d="M 168 675 V 622 H 308 V 556" class="wire dependency" marker-end="url(#arrow)"/>
<path d="M 1020 556 V 641 H 700 V 675" class="wire " marker-end="url(#arrow)"/>
<path d="M 906 728 H 917 V 629 H 1234 V 556" class="wire " marker-end="url(#arrow)"/>
<path d="M 1265 556 V 675" class="wire " marker-end="url(#arrow)"/>
<rect x="52" y="675" width="412" height="144" rx="10" class="panel"/><text x="74" y="706" class="eyebrow">EXTEND / DOMAIN PACK</text><text x="74" y="741" class="title">Your rules, your use case</text><text x="74" y="772" class="sub">Action schema · evidence · policy</text><text x="74" y="797" class="sub">Refunds / access / deployment / custom</text><rect x="494" y="675" width="412" height="144" rx="10" class="panel"/><text x="516" y="706" class="eyebrow">EXECUTE / ADAPTER</text><text x="516" y="741" class="title">Idempotent effects</text><text x="516" y="772" class="sub">Dispatch → authoritative reconciliation</text><text x="516" y="797" class="sub">Reference effects are simulated</text><rect x="936" y="675" width="412" height="144" rx="10" class="panel"/><text x="958" y="706" class="eyebrow">RECORD / INVESTIGATE</text><text x="958" y="741" class="title">Linked audit + receipts</text><text x="958" y="772" class="sub">SQLite · signatures · historical replay</text><text x="958" y="797" class="sub">Lifecycle records, not just final results</text>
<text x="52" y="857" class="eyebrow amber">AUTHORITY IS EXPLICIT</text>
<text x="340" y="857" class="sub">Unknown ≠ failed. Retain reservations; reconcile using the original key.</text>
<text x="52" y="883" class="sub" style="font-size:14px">Embedded SQLite runtime. Trusted adapters. Deployment authentication and credential isolation remain integration responsibilities.</text>
</svg>
