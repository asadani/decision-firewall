name: Model-free verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts examples benchmarks
      - run: python -m ruff format --check src tests scripts examples benchmarks
      - run: python -m mypy src/decision_firewall
      - run: python -m pytest -q
      - run: python scripts/check-safety-mutations.py --output .runtime-mutations/report.json
      - run: python -m build
      - run: firewall benchmark runs/fixture --provider fixture --variations 0
      - run: firewall framework --domain access demo
      - run: firewall framework --domain refunds demo
      - run: python examples/deployments/run.py --home .runtime-deployment-ci
      - run: firewall conformance decision_firewall.conformance_fixtures:deployments
      - run: firewall init .runtime-starter
      - run: python .runtime-starter/run.py
      - run: python .runtime-starter/workflow.py
      - run: python .runtime-starter/prepare.py
      - run: python examples/preparation.py
      - run: python examples/workbench/run.py .runtime-workbench
      - run: python -m benchmarks.framework_value.runner --output .runtime-value-ci --provider controlled_fixture --repetitions 1
      - run: python -m benchmarks.reuse_observability.runner --output .runtime-reuse-ci --mode conformance
      - run: python scripts/verify-core-wheel.py
      - run: python scripts/check-doc-links.py
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.lock -r requirements-telemetry.lock pytest
      - run: python -m pip install --no-deps .
      - run: python -m pytest tests/test_observation.py tests/test_telemetry.py -q

